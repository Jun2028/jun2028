<style>svg{color:#43474b}@media(prefers-color-scheme:dark){svg{color:#b3b7bc}} .light{animation:travel 14.4s linear -1.3s infinite} @keyframes travel{from{transform:translateX(-1206.80px)}to{transform:translateX(1206.80px)}} @media(prefers-reduced-motion:reduce){.light{animation:none;opacity:0}}</style>
